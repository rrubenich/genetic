# Tiny DNA language model: ~6M params, trains on a laptop (Apple MPS).
# Paths are relative to model/.

tokenizer_dir: runs/tokenizer

data:
  fasta_dir: data/hg19
  out_dir: data/processed
  train_chroms: [chr22]
  validation_chroms: [chr21]   # split by chromosome, so validation never overlaps training
  window: 1024                 # bases per example (1026 tokens with [BOS]/[EOS])
  max_n_fraction: 0.01         # drop windows with more than 1% unknown bases
  reverse_complement_train: true

model:                         # LlamaForCausalLM
  hidden_size: 256
  num_hidden_layers: 6
  num_attention_heads: 8
  intermediate_size: 1024
  vocab_multiple: 8            # pad the embedding table to a multiple of 8 (9 tokens -> 16)

training:                      # transformers TrainingArguments
  output_dir: runs/tiny
  max_steps: 4000
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  learning_rate: 1.0e-3
  lr_scheduler_type: cosine
  warmup_steps: 200
  weight_decay: 0.1
  max_grad_norm: 1.0
  eval_strategy: steps
  eval_steps: 500
  max_eval_samples: 1024       # evaluate on a fixed subset during training (full set in evaluate.py)
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  logging_steps: 50
  dataloader_pin_memory: false # not supported on MPS
  seed: 42
