[project]
name = "genetic-model"
version = "0.1.0"
description = "A small DNA language model trained from scratch on the human reference genome (GRCh37) with Hugging Face"
readme = "README.md"
authors = [
    { name = "Rafael Rubenich", email = "rfrubenich@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pyfaidx>=0.9.1",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
